[package]
name = "key-desk"
version = "0.0.2"
edition = "2024"

# Development branch only. Drop this default before merging back onto a release branch.
[features]
default = ["dev"]
dev = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
block2 = { version = "0.6", default-features = false }
chrono = "0.4.45"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
fern = "0.7"
log = "0.4"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "3"
objc2 = { version = "0.6", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
